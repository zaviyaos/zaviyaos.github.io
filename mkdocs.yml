site_name: Zaviya
site_url: https://steamos-arm-port.github.io/zaviya/
site_description: Zaviya, for ARM handhelds. Based on Valve's SteamOS.
repo_url: https://github.com/hashtagbasit/SteamOS-ARM-Port
repo_name: Zaviya on GitHub
edit_uri: ""
copyright: >-
  Based on Valve's SteamOS. Not affiliated with or endorsed by Valve.
  Steam and SteamOS are trademarks of Valve Corporation.

theme:
  name: material
  custom_dir: overrides
  logo: assets/frame.svg
  favicon: assets/mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/site.css

extra_javascript:
  - assets/site.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hashtagbasit/SteamOS-ARM-Port
    - icon: fontawesome/brands/discord
      link: https://discord.gg/EP53nZYvg
      name: Discord
    - icon: simple/kofi
      link: https://ko-fi.com/aimalb
    - icon: fontawesome/brands/paypal
      link: https://paypal.me/Basit2000
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Downloads: downloads.md
  - Devices:
      - Supported Devices: devices/index.md
      - AYANEO: devices/ayaneo.md
      - AYANEO Pocket DMG: devices/pocket-dmg.md
      - AYN: devices/ayn.md
      - KONKR: devices/konkr.md
      - Lenovo: devices/lenovo.md
      - Retroid: devices/retroid.md
      - REDMAGIC: devices/redmagic.md
  - Getting Started:
      - Flash to a microSD Card: getting-started/install.md
      - Flash OpenABL: getting-started/abl.md
      - Install to Internal Storage: getting-started/internal-storage.md
  - Using Zaviya:
      - Updates: using/updates.md
      - Zaviya Loadout: using/loadout.md
      - PC Games: using/pc-games.md
      - Frame Generation: using/frame-generation.md
      - Android Apps: using/android-apps.md
      - Dual Screen: using/bottom-screen.md
      - Performance and SSH: using/tips.md
  - Help:
      - Known Issues: help/known-issues.md
      - Troubleshooting: help/troubleshooting.md
      - FAQ: help/faq.md
  - Support: support.md
