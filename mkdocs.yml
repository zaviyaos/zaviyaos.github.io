site_name: Zaviya
site_url: https://zaviyaos.github.io/
site_description: Zaviya, for ARM handhelds. Based on SteamOS for ARM.
repo_url: https://github.com/hashtagbasit/Zaviya
repo_name: Zaviya on GitHub
edit_uri: ""
copyright: >-
  Zaviya is an independent community project. Steam and SteamOS are trademarks
  of their owner.

theme:
  name: material
  custom_dir: overrides
  logo: assets/frame.svg
  favicon: assets/mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/site.css

extra_javascript:
  - assets/site.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hashtagbasit/Zaviya
    - icon: fontawesome/brands/discord
      link: https://discord.gg/e2Cn85uQh9
      name: Discord
    - icon: simple/kofi
      link: https://ko-fi.com/aimalb
    - icon: fontawesome/brands/paypal
      link: https://paypal.me/Basit2000
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Downloads: downloads.md
  - Install:
      - Before you begin: getting-started/index.md
      - Flash to a microSD card: getting-started/install.md
      - Flash OpenABL: getting-started/abl.md
      - Install to internal storage: getting-started/internal-storage.md
  - Devices:
      - Supported devices: devices/index.md
      - AYANEO: devices/ayaneo.md
      - AYANEO Pocket DMG: devices/pocket-dmg.md
      - AYN: devices/ayn.md
      - KONKR: devices/konkr.md
      - Lenovo: devices/lenovo.md
      - MANGMI: devices/mangmi.md
      - Retroid: devices/retroid.md
      - REDMAGIC: devices/redmagic.md
  - Using Zaviya:
      - Overview: using/index.md
      - Zaviya Loadout: using/loadout.md
      - Emulation: using/emulation.md
      - PC games: using/pc-games.md
      - Android apps: using/android-apps.md
      - Frame generation: using/frame-generation.md
      - Dual screen: using/bottom-screen.md
      - Performance and SSH: using/tips.md
      - Updates: using/updates.md
  - Compatibility: compatibility.md
  - Troubleshooting:
      - Common problems: help/troubleshooting.md
      - Known issues: help/known-issues.md
      - FAQ: help/faq.md
  - Project:
      - About Zaviya: project/index.md
      - Community and support: project/community.md
